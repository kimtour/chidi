name: Chidi CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Chidi and test dependencies
        run: python -m pip install -e ".[dev]" -c requirements.lock.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run mock evaluations
        run: python scripts/run_eval.py
