[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chidi"
version = "0.1.0"
description = "Socratic learning companion with evaluation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "langgraph==1.2.12",
]

[project.optional-dependencies]
evaluation = ["ragas==0.4.3", "langchain-community==0.3.31", "openai==1.109.1"]
retrieval = ["qdrant-client==1.19.1", "fastembed==0.8.1"]
analysis = ["pandas==3.0.6"]
live = [
    "anthropic==1.11.0",
    "python-dotenv==1.2.4", "langsmith==0.14.4"]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
